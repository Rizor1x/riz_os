[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# Используем 0.5, как ты и просил. Она стабильна.
limine = "0.5.0"
x86_64 = "0.15.4" 
# Драйвер для последовательного порта (чтобы писать в консоль)
uart_16550 = "0.4.0"
# Для спинлоков (блокировок), так как у нас пока нет потоков
spin = "0.10"

lazy_static = { version = "1.4.0", features = ["spin_no_std"] }

[lib]
name = "kernel_core" # Назовем либу kernel_core
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false