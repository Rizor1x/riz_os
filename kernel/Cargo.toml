[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
limine = "0.5.0"
x86_64 = "0.15.4" 
uart_16550 = "0.4.0"
spin = "0.10"
linked_list_allocator = "0.10.5"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

lazy_static = { version = "1.4.0", features = ["spin_no_std"] }

[lib]
name = "kernel_core" # Назовем либу kernel_core
path = "src/lib.rs"
test = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false